[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawlock"
version = "2.6.0"
description = "Comprehensive security scanner, red-teamer & hardening toolkit for Claw-based AI agent deployments"
readme = "README.md"
license = {text = "Apache-2.0 OR MIT"}
requires-python = ">=3.9"
authors = [{name = "g0at"}]
keywords = ["security", "ai-agent", "openclaw", "zeroclaw", "claude-code", "mcp", "red-team", "hardening", "llm-security", "prompt-injection", "supply-chain", "tool-poisoning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "httpx>=0.25",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
# promptfoo is a Node.js CLI, not a Python dependency.  Keep the extra for
# backwards-compatible installs; operators install a pinned promptfoo binary.
redteam = []
dev = ["pytest>=7.0", "ruff==0.16.4", "mypy>=1.8"]

[project.scripts]
clawlock = "clawlock.__main__:app"

[project.urls]
Homepage = "https://github.com/g1at/ClawLock/"
Repository = "https://github.com/g1at/ClawLock/"

[tool.setuptools.packages.find]
include = ["clawlock*"]
exclude = ["tests*", "skill*"]

[tool.setuptools.package-data]
"clawlock.scanners" = ["bip39_english.txt"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Ruff 0.16 changed its implicit rule selection.  Keep CI and local checks on
# the project's established correctness baseline instead of inheriting tool
# defaults that can change between releases.
select = ["E4", "E7", "E9", "F"]
